<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Voice Assistant</title>
<style>
body{background:#101827;color:white;font-family:Arial;text-align:center;padding:20px}
.app{max-width:420px;margin:30px auto;background:#1e293b;padding:20px;border-radius:20px}
button,select{padding:12px;margin:8px;border-radius:10px;font-size:16px}
#reply{white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
<h1>🎙️ AI Voice Assistant</h1>
<p>Choose your language</p>
<select id="lang">
<option value="en-US">English</option>
<option value="ur-PK">Urdu</option>
<option value="hi-IN">Hindi</option>
</select><br>
<button onclick="listen()">🎤 Speak</button>
<button onclick="reply()">🔊 Reply</button>
<p id="reply">Your assistant is ready!</p>
</div>
<script>
function reply(){
let l=document.getElementById('lang').value;
let m={'en-US':'Hello! I am your voice assistant.','ur-PK':'السلام علیکم، میں آپ کا اسسٹنٹ ہوں۔','hi-IN':'नमस्ते، मैं आपका सहायक हूँ۔'}[l];
document.getElementById('reply').textContent=m;
let u=new SpeechSynthesisUtterance(m);u.lang=l;speechSynthesis.speak(u);
}
function listen(){
let R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){document.getElementById('reply').textContent='Please open in Chrome.';return;}
let r=new R();r.lang=document.getElementById('lang').value;
r.onresult=e=>document.getElementById('reply').textContent='You said: '+e.results[0][0].transcript;
r.onerror=()=>document.getElementById('reply').textContent='Allow microphone access and try again.';
r.start();
}
</script>
</body>
</html>
